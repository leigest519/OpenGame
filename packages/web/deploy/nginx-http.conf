# Enable this before requesting the certificate. Other websites are unaffected.
server {
    listen 80;
    listen [::]:80;
    server_name studio.xiajuan.app studio-games.xiajuan.app;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/opengame-acme;
        try_files $uri =404;
    }
    location / {
        return 308 https://$host$request_uri;
    }
}
