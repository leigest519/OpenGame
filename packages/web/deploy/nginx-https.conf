# Install after the certificate for both hosts exists. Keep nginx-http.conf.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name studio.xiajuan.app;
    ssl_certificate /etc/letsencrypt/live/opengame-studio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/opengame-studio/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    # JSON image uploads are base64; individual API routes enforce tighter limits.
    client_max_body_size 16m;
    access_log off;

    location / {
        proxy_pass http://127.0.0.1:4190;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name studio-games.xiajuan.app;
    ssl_certificate /etc/letsencrypt/live/opengame-studio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/opengame-studio/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 32k;
    # Both access and upstream-error logs can contain the revocable game ticket.
    access_log off;
    error_log /dev/null;

    location / {
        proxy_pass http://127.0.0.1:4191;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_cache off;
        proxy_read_timeout 30s;
    }
}
